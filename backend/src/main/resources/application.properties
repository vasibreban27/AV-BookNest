spring.application.name=backend
server.port=8085
# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Multipart book covers. The service also validates type and size before upload.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=7MB

# Cloudinary server-side uploads. Never expose API_SECRET to the frontend.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:}
app.cloudinary.max-file-size=5MB

# Authentication - JWT_SECRET must contain at least 32 characters.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d

# Account security links. When mail is disabled, links are logged for local development.
app.auth.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.auth.email-verification-expiration=${EMAIL_VERIFICATION_EXPIRATION:24h}
app.auth.password-reset-expiration=${PASSWORD_RESET_EXPIRATION:30m}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@booknest.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# Public contact form. It uses the same SMTP account as transactional emails.
app.contact.recipient=${CONTACT_RECIPIENT:av.booknest@gmail.com}
app.contact.rate-limit.attempts=${CONTACT_ATTEMPTS:5}
app.contact.rate-limit.window=${CONTACT_RATE_WINDOW:1h}

# In-memory limits are appropriate for the current single backend instance.
app.auth.rate-limit.login-account-attempts=${LOGIN_ACCOUNT_ATTEMPTS:5}
app.auth.rate-limit.login-ip-attempts=${LOGIN_IP_ATTEMPTS:20}
app.auth.rate-limit.login-window=${LOGIN_RATE_WINDOW:15m}
app.auth.rate-limit.register-attempts=${REGISTER_ATTEMPTS:5}
app.auth.rate-limit.register-window=${REGISTER_RATE_WINDOW:1h}
app.auth.rate-limit.email-attempts=${AUTH_EMAIL_ATTEMPTS:3}
app.auth.rate-limit.email-window=${AUTH_EMAIL_RATE_WINDOW:1h}

# Comma-separated origins allowed to call the API from a browser.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Sameday eAWB API. Keep disabled until contract credentials and the Basic
# service/pickup point identifiers are available.
app.sameday.enabled=${SAMEDAY_ENABLED:true}
app.sameday.base-url=${SAMEDAY_BASE_URL:https://api.sameday.ro}
app.sameday.username=${SAMEDAY_USERNAME:}
app.sameday.password=${SAMEDAY_PASSWORD:}
app.sameday.service-id=${SAMEDAY_SERVICE_ID:}
app.sameday.pickup-point-id=${SAMEDAY_PICKUP_POINT_ID:}
app.sameday.mock-enabled=${SAMEDAY_MOCK_ENABLED:true}

# Stripe Connect. Use only pk_test_/sk_test_ keys until the platform is ready for live onboarding.
app.stripe.enabled=${STRIPE_ENABLED:true}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.connect-return-url=${STRIPE_CONNECT_RETURN_URL:http://localhost:5173/account?stripe=return}
app.stripe.connect-refresh-url=${STRIPE_CONNECT_REFRESH_URL:http://localhost:5173/account?stripe=refresh}
app.stripe.payment-return-url=${STRIPE_PAYMENT_RETURN_URL:http://localhost:5173/orders}
app.stripe.payment-expiration-minutes=${STRIPE_PAYMENT_EXPIRATION_MINUTES:30}
